<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
<!-- Standalone Web migration layer -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/supabase-adapter.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1"><style>
: root {
  --navy: #132b43;
  --gold: #d9b86b;
  --ink: #20384c;
  --muted: #738393;
  --line: #e3e9ed
}
* {
  box-sizing: border-box
}
body {
  margin: 0;
  background: #f3f5f7;
  color: var(--ink);
  font: 15px Tahoma, Arial, sans-serif
}
header {
  background: var(--navy);
  color: white;
  padding: 32px max(4vw, 20px);
  display: flex;
  justify-content: space-between;
  gap: 24px;
  border-bottom: 4px solid var(--gold)
}
h1 {
  font-size: 30px;
  margin: 12px 0
}
h2 {
  font-size: 19px;
  margin: 0 0 8px
}
p {
  line-height: 1.7;
  margin: 6px 0
}
header p {
  color: #b5c4d1
}
.eyebrow {
  font: 11px Arial;
  letter-spacing: 2px;
  color: var(--gold)
}
.header-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: center;
  gap: 18px
}
main {
  max-width: 1700px;
  margin: auto;
  padding: 26px max(3vw, 16px)
}
button, input, select, textarea {
  font: inherit
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: white;
  color: var(--navy);
  padding: 11px 16px;
  font-weight: bold
}
button: hover {
  filter: brightness(.96)
}
button: disabled {
  opacity: .5;
  cursor: wait
}
.gold {
  background: var(--gold);
  border-color: var(--gold)
}
.cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin: 12px 0 26px
}
.cards article {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px;
  border-top: 3px solid var(--navy)
}
.cards strong {
  display: block;
  font: 700 32px Arial;
  margin: 16px 0
}
.cards small {
  color: var(--muted);
  font-size: 12px
}
.cards .warning {
  border-top-color: #d69c2e
}
.warning strong {
  color: #b47512
}
.cards .danger {
  border-top-color: #cb5252
}
.danger strong {
  color: #b43a3a
}
.panel {
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden
}
.section-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 24px
}
.section-head p {
  font-size: 12px;
  color: var(--muted)
}
.actions {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap
}
.filters {
  display: flex;
  gap: 12px;
  padding: 0 24px 22px
}
.filters input {
  flex: 1
}
input, select, textarea {
  border: 1px solid #ccd6dd;
  border-radius: 7px;
  background: #fff;
  color: var(--ink);
  padding: 11px;
  min-width: 0
}
input: focus, select: focus, textarea: focus {
  outline: 2px solid var(--gold);
  outline-offset: 1px
}
.table-wrap {
  overflow: auto
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap
}
th {
  text-align: right;
  background: #eef2f5;
  color: #5e7080;
  font-weight: normal;
  padding: 15px 13px
}
td {
  border-bottom: 1px solid #edf0f3;
  padding: 16px 13px
}
tbody tr: hover {
  background: #fafbfd
}
td: nth-child(2) {
  font-weight: bold
}
td: nth-child(14) {
  white-space: normal;
  min-width: 120px;
  max-width: 260px;
  overflow-wrap: anywhere
}
.badge {
  display: inline-block;
  border-radius: 20px;
  padding: 6px 10px;
  font-size: 11px;
  background: #e6f4ed;
  color: #287252
}
.badge.soon, .badge.today {
  background: #fff0cd;
  color: #98680c
}
.badge.expired {
  background: #fce8e8;
  color: #aa3838
}
.badge.empty {
  background: #edf0f3;
  color: #71808b
}
.table-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 20px 24px;
  font-size: 13px
}
footer {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 24px
}
#message {
  line-height: 1.6;
  padding: 0
}
#message: not(: empty) {
  padding: 12px;
  border-radius: 8px;
  background: #e5edf5
}
#message.error {
  background: #fce8e8;
  color: #a42c2c
}
dialog {
  border: 0;
  border-radius: 16px;
  padding: 26px;
  width: 650px;
  max-width: 95vw;
  max-height: 92vh;
  color: var(--ink)
}
dialog: : backdrop {
  background: #091d30aa
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between
}
.hint {
  font-size: 12px;
  color: var(--muted);
  margin: 10px 0 22px
}
.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 17px
}
label {
  display: flex;
  flex-direction: column;
  gap: 9px;
  font-size: 13px
}
.wide {
  grid-column: 1/-1
}
output {
  padding: 11px;
  background: #edf3f7;
  border-radius: 7px;
  font-weight: bold
}
.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px
}
#formError {
  color: #b23c3c;
  font-size: 13px
}
.report-title {
  display: none
}
@media(max-width: 800px) {
  header {
    padding: 24px 18px
  }
  h1 {
    font-size: 23px
  }
  .cards {
    grid-template-columns: 1fr 1fr
  }
  .cards article {
    padding: 16px
  }
  .cards strong {
    font-size: 26px
  }
  .section-head {
    flex-direction: column
  }
  .filters {
    flex-wrap: wrap
  }
  .filters>* {
    width: 100%
  }
  .header-side {
    font-size: 12px
  }
  .form-grid {
    gap: 12px
  }
}
@media print {
  @page {
    size: A4 landscape;
    margin: 10mm
  }
  body {
    background: white;
    color: #000;
    font-size: 10px
  }
  header, .cards, .section-head, .filters, footer, #message, dialog, .no-print {
    display: none!important
  }
  main {
    padding: 0;
    max-width: none
  }
  .panel {
    border: 0;
    border-radius: 0
  }
  .report-title {
    display: block;
    margin-bottom: 15px
  }
  .report-title p {
    font-size: 11px
  }
  .table-wrap {
    overflow: visible
  }
  table {
    font-size: 9px;
    white-space: normal;
    table-layout: auto
  }
  thead {
    display: table-header-group
  }
  th, td {
    padding: 7px 4px;
    overflow-wrap: anywhere
  }
  td: nth-child(14) {
    min-width: 0;
    max-width: 160px
  }
  tr {
    break-inside: avoid
  }
  .badge {
    font-size: 9px;
    padding: 2px;
    color: #000!important;
    background: none!important
  }
  .table-foot {
    padding: 12px 0
  }
  .table-foot strong {
    font-size: 11px
  }
}
.filters {
  flex-wrap: wrap
}
.filters select {
  max-width: 100%
}
.legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
  padding: 0 24px 20px;
  font-size: 11px;
  color: var(--muted)
}
.badge.today {
  background: #fce1e9;
  color: #a41748
}
.badge.urgent {
  background: #ffe7d4;
  color: #ad4a08
}
.badge.expired {
  background: #f8d6d6;
  color: #962828
}
tr.expiry-expired {
  background: #fff0f0
}
tr.expiry-today {
  background: #fff1f6
}
tr.expiry-urgent {
  background: #fff6ee
}
tr.expiry-soon {
  background: #fffbec
}
tr.expiry-safe {
  background: #f7fcf9
}
tr.expiry-expired td: first-child {
  border-right: 4px solid #be3434
}
tr.expiry-today td: first-child {
  border-right: 4px solid #c13062
}
tr.expiry-urgent td: first-child {
  border-right: 4px solid #e47b22
}
tr.expiry-soon td: first-child {
  border-right: 4px solid #deb443
}
tr.expiry-safe td: first-child {
  border-right: 4px solid #439771
}
tr.archived td {
  color: #6c7580
}
.no-print button {
  font-size: 11px;
  padding: 8px
}
.filters input {
  min-width: 180px
}
@media print {
  .legend {
    display: none
  }
  table {
    font-size: 8px
  }
  tr {
    background: white!important
  }
  th, td {
    padding: 6px 3px
  }
  tr td: first-child {
    border-right: 0!important
  }
}
.badge.missing {
  background: #e9e8f6;
  color: #5d5388
}
tr.expiry-missing {
  background: #f7f7fb
}
tr.expiry-missing td: first-child {
  border-inline-start: 4px solid #8c82b2
}
th {
  text-align: start
}
#importDialog {
  width: 1100px
}
#importPreview {
  max-height: 55vh
}
#importMessage {
  font-size: 13px;
  line-height: 1.8
}
.form-grid input[readonly] {
  background: #eef1f4;
  color: #657789
}
html[dir=ltr] tr td: first-child {
  border-right: none
}
html[dir=ltr] tr.expiry-expired td: first-child {
  border-left: 4px solid #be3434
}
html[dir=ltr] tr.expiry-today td: first-child {
  border-left: 4px solid #c13062
}
html[dir=ltr] tr.expiry-urgent td: first-child {
  border-left: 4px solid #e47b22
}
html[dir=ltr] tr.expiry-soon td: first-child {
  border-left: 4px solid #deb443
}
html[dir=ltr] tr.expiry-safe td: first-child {
  border-left: 4px solid #439771
}
td: nth-child(3), td: nth-child(6), td: nth-child(17) {
  white-space: normal;
  min-width: 120px;
  overflow-wrap: anywhere
}
td: nth-child(14) {
  min-width: 0
}
@media print {
  table {
    font-size: 7px
  }
  th, td {
    padding: 5px 2px
  }
  td: nth-child(3), td: nth-child(6), td: nth-child(17) {
    min-width: 0;
    max-width: 100px
  }
  tr td: first-child {
    border: 0!important
  }
}
/* Fit the complete review table to desktop width; wrap labels and long values. */
main {
  max-width: none;
  padding-inline: 16px
}
.panel>.table-wrap {
  overflow: visible
}
#stockTable {
  table-layout: fixed;
  width: 100%;
  white-space: normal;
  font-size: 12px
}
#stockTable th, #stockTable td {
  min-width: 0;
  max-width: none;
  padding: 10px 5px;
  overflow-wrap: anywhere;
  white-space: normal;
  vertical-align: middle
}
#stockTable th {
  font-weight: bold;
  line-height: 1.5
}
#stockTable td {
  line-height: 1.5
}
#stockTable .col-receivingNumber {
  width: 5%
}
#stockTable .col-received {
  width: 6.5%
}
#stockTable .col-sourceStatus {
  width: 5%
}
#stockTable .col-code {
  width: 6%
}
#stockTable .col-item {
  width: 12%
}
#stockTable .col-store {
  width: 6%
}
#stockTable .col-unit {
  width: 5%
}
#stockTable .col-quantity {
  width: 4%
}
#stockTable .col-price {
  width: 6%
}
#stockTable .col-total {
  width: 7%
}
#stockTable .col-expiry {
  width: 15%
}
#stockTable .col-days {
  width: 5%
}
#stockTable .col-archiveState {
  width: 5%
}
#stockTable .col-notes {
  width: 5%
}
.expiry-editor {
  display: flex;
  gap: 4px;
  align-items: center;
  width: 100%
}
.expiry-editor input {
  flex: 1 1 0;
  width: 0;
  min-width: 0;
  padding: 6px 2px;
  font: 12px Arial;
  height: 32px
}
.expiry-editor button {
  flex: none;
  padding: 6px 5px;
  font-size: 11px;
  min-height: 32px
}
.expiry-print {
  display: none
}
#stockTable .row-actions button {
  display: block;
  width: 100%;
  margin: 3px 0;
  padding: 5px 2px;
  font-size: 10px;
  font-weight: normal;
  overflow-wrap: anywhere
}
@media(min-width: 851px) and (max-width: 1200px) {
  #stockTable {
    font-size: 11px
  }
  #stockTable th, #stockTable td {
    padding: 8px 3px
  }
  .expiry-editor input {
    font-size: 10px
  }
  .expiry-editor button {
    font-size: 10px;
    padding: 5px 3px
  }
}
/* Small screens use vertical records instead of horizontal scrolling. */
@media screen and (max-width: 850px) {
  #stockTable, #stockTable tbody, #stockTable tr, #stockTable td {
    display: block;
    width: 100%!important
  }
  #stockTable thead {
    display: none
  }
  #stockTable tr {
    border: 1px solid var(--line);
    border-radius: 10px;
    margin: 12px 0;
    padding: 10px
  }
  #stockTable td {
    display: grid;
    grid-template-columns: 42% minmax(0, 1fr);
    gap: 12px;
    padding: 8px!important;
    border: 0!important;
    font-size: 13px
  }
  #stockTable td: : before {
    content: attr(data-label);
    font-weight: bold;
    color: var(--muted)
  }
  #stockTable .row-actions {
    display: flex
  }
  #stockTable .row-actions: : before {
    display: none
  }
  .expiry-editor input {
    font-size: 12px
  }
  header {
    flex-wrap: wrap
  }
  .header-side {
    align-items: stretch;
    width: 100%
  }
  .table-foot {
    flex-wrap: wrap
  }
}
@media print {
  main {
    padding: 0
  }
  .expiry-print {
    display: inline
  }
  .expiry-editor {
    display: none!important
  }
  #stockTable {
    table-layout: fixed;
    font-size: 8px
  }
  #stockTable th, #stockTable td {
    padding: 5px 2px
  }
  #stockTable .col-expiry {
    width: 9%
  }
  #stockTable th.no-print, #stockTable td.no-print {
    display: none!important
  }
}
[hidden] {
  display: none!important
}
.view-tabs {
  display: flex;
  gap: 8px;
  margin: 0 0 18px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px
}
.view-tabs button {
  min-width: 155px
}
.view-tabs .selected {
  background: var(--navy);
  border-color: var(--navy);
  color: white
}
#stockTable .col-days {
  width: 10%;
  text-align: center
}
.days-badge {
  font-size: 13px;
  font-weight: bold;
  padding: 9px 12px;
  line-height: 1.5;
  max-width: 100%;
  border-radius: 22px
}
.days-badge.safe {
  background: #e3f3ec;
  color: #23684c
}
.days-badge.missing {
  font-size: 11px
}
.days-badge.expired {
  font-size: 12px
}
@media screen and (max-width: 850px) {
  #stockTable .col-days {
    text-align: start
  }
  .days-badge {
    justify-self: start
  }

  }

  #stockTable .col-days {
    width: 10%
  }
  .days-badge {

  }

: root {
  --navy: #09223e;
  --gold: #deb96c;
  --ink: #153456;
  --muted: #7c8ba0;
  --line: #e2e9f1;
  --surface: #fff;
  --page: #f5f7fa;
  --side: 238px
}
body {
  background: var(--page);
  font: 14px Tahoma, Arial, sans-serif
}
button {
  transition: background .15s, box-shadow .15s
}
button: focus-visible, [role=button]: focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px
}
button: disabled {
  cursor: not-allowed
}
.svg-sprite {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden
}
.icon {
  width: 23px;
  height: 23px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0
}
.sidebar {
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--side);
  background: linear-gradient(145deg, #041b32, #0c2948);
  color: #fff;
  border-right: 1px solid #ffffff16;
  z-index: 30;
  overflow-y: auto;
  padding: 18px 8px;
  direction: ltr
}
.brand {
  height: 118px;
  display: flex;
  justify-content: center;
  align-items: center
}
.brand img {
  max-width: 135px;
  max-height: 95px;
  object-fit: contain
}
.brand-fallback {
  display: none
}
.side-menu {
  display: grid;
  gap: 9px
}
.nav-button {
  display: flex;
  align-items: center;
  gap: 23px;
  width: 100%;
  padding: 17px 20px;
  background: transparent;
  color: #f2f6ff;
  border: 0;
  text-align: start;
  font-weight: normal;
  white-space: normal;
  font-size: 15px
}
.nav-button .icon {
  width: 26px;
  height: 26px
}
.nav-button.selected {
  background: linear-gradient(105deg, #f5d286, #b59b65aa);
  color: #07213c;
  font-weight: bold
}
.nav-button: hover {
  background-color: #ffffff12
}
.side-bottom {
  margin: 32px 14px 0;
  padding: 25px 0;
  border-top: 1px solid #bfa66b66;
  text-align: center;
  color: var(--gold);
  font: 10px Arial;
  letter-spacing: 3px
}
.side-building .icon {
  width: 70px;
  height: 70px;
  stroke-width: .8;
  margin-bottom: 15px
}
.side-bottom p {
  color: #cad7e5;
  letter-spacing: 5px;
  line-height: 1.9;
  margin-top: 20px
}
.workspace {
  margin-left: var(--side);
  min-width: 0
}
.topbar {
  height: 78px;
  padding: 12px 24px;
  border: 0;
  background: linear-gradient(100deg, #08233f, #203e63);
  display: flex;
  direction: ltr;
  align-items: center;
  justify-content: space-between;
  gap: 20px
}
.top-search, .top-tools {
  display: flex;
  align-items: center;
  gap: 19px;
  min-width: 0
}
.top-search {
  flex: 1
}
.icon-button {
  background: transparent;
  color: white;
  border: 0;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center
}
.quick-search {
  flex: 1;
  max-width: 410px;
  position: relative;
  display: flex;
  flex-direction: row;
  align-items: center;
  border: 1px solid #ffffff20;
  border-radius: 16px;
  background: #0a264755;
  padding: 0 14px
}
.quick-search input {
  width: 100%;
  padding: 14px 0;
  background: transparent;
  border: 0;
  color: white;
  text-align: start
}
.quick-search input: : placeholder {
  color: #bacbdf
}
.quick-search .icon {
  order: 2
}
.date-block {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  white-space: nowrap
}
.date-block>.icon {
  color: var(--gold);
  width: 28px;
  height: 28px
}
.date-block small, .profile small {
  display: block;
  color: #b6c9dd;
  margin-top: 6px;
  font-size: 11px
}
.theme-toggle {
  border: 1px solid var(--gold);
  border-radius: 30px;
  color: var(--gold)
}
.notification {
  position: relative
}
.notification span {
  position: absolute;
  top: -1px;
  right: -3px;
  min-width: 15px;
  border-radius: 20px;
  background: #dd434c;
  font: 9px Arial;
  padding: 3px
}
.language-button {
  background: #ffffff10;
  color: white;
  border-color: #ffffff22;
  padding: 8px;
  font-size: 11px
}
.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  white-space: nowrap
}
.profile strong {
  font-weight: normal;
  font-size: 15px
}
.avatar {
  border: 2px solid var(--gold);
  border-radius: 50%;
  width: 49px;
  height: 49px;
  display: grid;
  place-items: center;
  font: 18px Arial
}
.hero {
  height: 255px;
  background-color: #09223e;
  background-size: cover;
  background-position: center 52%;
  display: flex;
  direction: ltr;
  justify-content: space-between;
  align-items: flex-start;
  padding: 38px 35px 65px;
  color: #fff
}
.hero-copy {
  max-width: 72%
}
.hero h1 {
  font: 36px Georgia, serif;
  margin: 0 0 15px
}
.hero h1 em {
  color: #e6b864;
  font-style: normal
}
.hero-kicker {
  font: 14px Arial;
  letter-spacing: 5px
}
.hero p {
  color: #e3e9f3;
  font-size: 14px;
  margin-top: 13px
}
.hospitality {
  font: italic 36px Georgia;
  color: #ebc878;
  text-align: center;
  padding-top: 5px
}
.hospitality small {
  display: block;
  font: 11px Arial;
  letter-spacing: 6px;
  color: white;
  margin-top: 9px
}
main {
  padding: 0 20px;
  max-width: none
}
.cards {
  position: relative;
  margin: -48px 0 18px;
  gap: 14px
}
.cards .metric {
  padding: 20px 17px;
  border: 1px solid var(--line);
  background: linear-gradient(120deg, #fff, var(--tint));
  border-radius: 12px;
  min-width: 0;
  min-height: 153px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  position: relative;
  cursor: pointer;
  box-shadow: 0 7px 24px #14345707;
  --accent: #153b68;
  --tint: #f2f7fe
}
.metric.value {
  --accent: #168453;
  --tint: #effaf5
}
.metric.soon {
  --accent: #a87518;
  --tint: #fff9ef
}
.metric.expired {
  --accent: #bd3942;
  --tint: #fff1f2
}
.metric-icon {
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: var(--accent);
  background: var(--tint);
  flex-shrink: 0
}
.metric-icon .icon {
  width: 34px;
  height: 34px
}
.metric-content {
  flex: 1;
  min-width: 0
}
.metric-content>span {
  font-size: 13px;
  font-weight: bold;
  display: block;
  line-height: 1.6
}
.cards strong {
  font: 700 34px Arial;
  margin: 16px 0;
  color: var(--accent);
  overflow-wrap: anywhere
}
.cards .value strong {
  color: var(--ink);
  font-size: 30px
}
.cards small {
  font-size: 10px;
  line-height: 1.7;
  display: block
}
.metric-arrow {
  display: none
}
.metric: hover {
  box-shadow: 0 7px 20px #12345519;
  transform: translateY(-1px)
}
#message: not(: empty) {
  padding: 8px 12px;
  font-size: 11px;
  margin: 0 0 14px
}
.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 245px;
  gap: 18px;
  direction: ltr;
  align-items: start
}
.content-grid>* {
  direction: rtl
}
html[dir=ltr] .content-grid>* {
  direction: ltr
}
.panel {
  background: var(--surface);
  min-width: 0
}
.section-head {
  padding: 20px 16px;
  align-items: center;
  gap: 10px
}
.section-title {
  display: flex;
  align-items: center;
  gap: 12px
}
.section-title h2 {
  font-size: 21px;
  margin: 0 0 4px
}
.section-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fcf3e1;
  color: #af7c20;
  flex-shrink: 0
}
.section-head p {
  font-size: 11px
}
.actions {
  gap: 7px
}
.actions button {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  padding: 9px 10px;
  min-height: 38px
}
.actions .icon {
  width: 17px;
  height: 17px
}
.gold {
  background: var(--navy);
  border-color: var(--gold);
  color: white;
  border-width: 2px
}
.filters {
  padding: 0 12px 14px;
  gap: 8px;
  flex-wrap: nowrap
}
.table-search {
  display: flex;
  flex-direction: row;
  align-items: center;
  flex: 1;
  min-width: 130px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding-inline: 9px
}
.table-search input {
  border: 0;
  width: 100%;
  min-width: 0;
  background: transparent;
  font-size: 11px;
  padding: 10px 0
}
.table-search .icon {
  width: 18px;
  color: #97a1b1
}
.filters select {
  font-size: 11px;
  padding: 9px 5px;
  max-width: 24%
}
.legend {
  padding: 0 12px 12px;
  gap: 5px
}
.legend .badge {
  font-size: 9px;
  padding: 5px 7px
}
.legend>span: last-child {
  font-size: 9px;
  flex-basis: 100%;
  padding-top: 4px
}
.table-wrap {
  padding: 0 10px
}
#stockTable {
  font-size: 11px
}
#stockTable th {
  background: #21364d;
  color: #f7f9fd;
  font-size: 10px;
  padding: 11px 3px
}
#stockTable td {
  padding: 9px 3px;
  border-color: var(--line);
  font-size: 11px;
  font-weight: normal
}
#stockTable th: first-child {
  border-radius: 0 7px 0 0
}
#stockTable th: last-child {
  border-radius: 7px 0 0 0
}
#stockTable td: first-child {
  border-width: 2px
}
.days-badge {
  padding: 7px 9px;
  font-size: 12px;
  border-radius: 10px
}
.days-badge.expired {
  font-size: 10px
}
.expiry-editor input {
  font-size: 10px;
  height: 30px
}
.expiry-editor button {
  font-size: 10px;
  padding: 5px 4px
}
.row-actions button {
  background: var(--surface)
}
.table-foot {
  padding: 16px;
  font-size: 11px
}
.insights {
  display: grid;
  gap: 17px
}
.insight {
  padding: 20px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  text-align: center
}
.insight-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px
}
.insight-heading>.icon {
  width: 40px;
  height: 40px;
  padding: 8px;
  background: #e9f2ff;
  border-radius: 50%;
  flex-shrink: 0
}
.insight h3 {
  font-size: 13px;
  margin: 0;
  line-height: 1.6
}
.insight>strong {
  display: block;
  font: 700 33px Arial;
  margin: 16px 0 12px
}
.insight p {
  font-size: 12px;
  color: var(--muted)
}
.insight small {
  font-size: 11px;
  color: var(--muted)
}
.nearest {
  background: linear-gradient(120deg, var(--surface), #fff3f3);
  border-color: #f3dddd
}
.nearest>strong {
  color: #b73940;
  font-size: 27px
}
.nearest .insight-heading>.icon {
  color: #c44148;
  background: #fbe3e5
}
.nearest #nearestName {
  color: var(--ink);
  margin: 15px 0 2px;
  font-weight: bold
}
.text-button {
  display: block;
  background: transparent;
  border: 0;
  font-size: 11px;
  padding: 10px 4px;
  margin: auto;
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 3px
}
.insight.total-items {
  background: linear-gradient(120deg, var(--surface), #f3f8ff)
}
.undated .insight-heading>.icon {
  color: #8b78b7;
  background: #f0eafa
}
.undated>strong {
  color: #8b78b7
}
dialog {
  background: var(--surface);
  box-shadow: 0 20px 80px #05162950
}
.settings-grid {
  display: grid;
  gap: 20px
}
.modal-actions button {
  display: flex;
  align-items: center;
  gap: 8px
}
input, select, textarea {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line)
}
.nav-backdrop {
  position: fixed;
  inset: 0;
  background: #03172a88;
  border: 0;
  border-radius: 0;
  z-index: 25
}
.nav-compact {
  --side: 76px
}
.nav-compact .brand img {
  max-width: 57px
}
.nav-compact .nav-button {
  justify-content: center;
  padding: 17px 8px
}
.nav-compact .nav-button span, .nav-compact .side-bottom {
  display: none
}
.nav-compact .brand {
  height: 100px
}
footer {
  line-height: 1.8
}
html[data-theme=dark] {
  --surface: #112c46;
  --page: #091e32;
  --ink: #e2ecf8;
  --muted: #a4b5c8;
  --line: #29435c
}
html[data-theme=dark] .cards .metric {
  background: #112c46;
  --tint: #193750
}
html[data-theme=dark] .cards strong {
  color: #ebc679
}
html[data-theme=dark] .nearest, html[data-theme=dark] .insight.total-items {
  background: #112c46
}
html[data-theme=dark] tr {
  background: #112c46
}
html[data-theme=dark] tbody tr: hover {
  background: #173653
}
html[data-theme=dark] button: not(.nav-button): not(.gold): not(.icon-button): not(.language-button): not(.nav-backdrop) {
  background: #173653;
  color: #e2ecf8
}
html[data-theme=dark] #message: not(: empty) {
  background: #183752;
  color: #dbe9f5
}
html[data-theme=dark] .form-grid input[readonly] {
  background: #1a3851;
  color: #bacadb
}
@media(max-width: 1799px) {
  .content-grid {
    grid-template-columns: 1fr
  }
  .insights {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-row: 2
  }
  .insight {
    padding: 15px
  }
  .insight>strong {
    font-size: 28px
  }
  .section-head {
    padding: 18px 15px
  }
  .hero h1 {
    font-size: 32px
  }
}
@media(max-width: 1450px) and (min-width: 761px) {
  : root {
    --side: 76px
  }
  .brand img {
    max-width: 57px
  }
  .brand {
    height: 100px
  }
  .nav-button {
    justify-content: center;
    padding: 17px 8px
  }
  .nav-button span, .side-bottom {
    display: none
  }
  .date-block {
    display: none
  }
  .hero {
    height: 240px
  }
  .cards .metric {
    padding: 18px 13px
  }
  .metric-icon {
    width: 46px;
    height: 46px
  }
  .metric-icon .icon {
    width: 29px;
    height: 29px
  }
  .cards strong {
    font-size: 30px
  }
  .cards .value strong {
    font-size: 27px
  }
}
@media(max-width: 1050px) {
  .cards {
    grid-template-columns: repeat(2, minmax(0, 1fr))
  }
  .cards .metric {
    min-height: 130px
  }
  .hero {
    height: 240px
  }
  .hospitality {
    display: none
  }
  .hero-copy {
    max-width: 100%
  }
  .profile small {
    display: none
  }
  .topbar {
    padding-inline: 15px
  }
  .top-tools {
    gap: 10px
  }
  .section-head {
    flex-wrap: wrap
  }
  .actions {
    width: 100%
  }
  .top-search {
    max-width: 45%
  }
}
@media(max-width: 760px) {
  : root {
    --side: 0px
  }
  .sidebar {
    width: 238px;
    transform: translateX(-100%);
    transition: transform .2s
  }
  .menu-open .sidebar {
    transform: translateX(0)
  }
  .workspace {
    margin-left: 0
  }
  .topbar {
    height: 68px;
    flex-wrap: nowrap;
    gap: 5px
  }
  .top-search {
    max-width: none;
    flex: 0
  }
  .quick-search, .profile, .notification, .date-block {
    display: none
  }
  .top-tools {
    gap: 12px
  }
  .hero {
    height: 215px;
    padding: 32px 20px 60px
  }
  .hero h1 {
    font-size: 25px;
    line-height: 1.5
  }
  .hero-kicker {
    font-size: 10px;
    letter-spacing: 3px
  }
  .hero p {
    font-size: 11px
  }
  main {
    padding: 0 10px
  }
  .cards {
    gap: 8px;
    margin-top: -30px
  }
  .cards .metric {
    padding: 13px 9px;
    gap: 5px;
    min-height: 150px;
    flex-direction: column
  }
  .metric-icon {
    width: 31px;
    height: 31px
  }
  .metric-icon .icon {
    width: 20px;
    height: 20px
  }
  .metric-content>span {
    font-size: 11px
  }
  .cards strong, .cards .value strong {
    font-size: 25px;
    margin: 10px 0
  }
  .cards small {
    font-size: 9px
  }
  .filters {
    flex-wrap: wrap
  }
  .filters>* {
    width: auto
  }
  .table-search {
    flex-basis: 100%
  }
  .filters select {
    max-width: none;
    flex: 1;
    min-width: 90px
  }
  .section-title h2 {
    font-size: 19px
  }
  .section-head {
    padding: 16px 12px
  }
  .section-head .actions button {
    flex: 1;
    justify-content: center;
    font-size: 10px
  }
  .section-head .actions .icon {
    display: none
  }
  .insights {
    grid-template-columns: 1fr
  }
  .form-grid {
    grid-template-columns: 1fr
  }
  dialog {
    padding: 20px
  }
  .table-foot {
    flex-wrap: wrap
  }
  .hero-copy {
    text-align: start
  }
  .side-menu .nav-button span {
    display: inline
  }
  .side-menu .nav-button {
    justify-content: flex-start;
    padding: 17px 20px
  }
  .brand img {
    max-width: 135px
  }
  .side-bottom {
    display: block
  }
  .brand {
    height: 118px
  }
}
@media screen and (min-width: 851px) and (max-width: 1050px) {
  .expiry-editor {
    flex-wrap: wrap
  }
  .expiry-editor input {
    width: 100%;
    flex-basis: 100%
  }
  .expiry-editor button {
    width: 100%
  }
}
@media print {
  .workspace {
    margin: 0
  }
  .hero, .sidebar, .topbar, .insights {
    display: none!important
  }
  .content-grid {
    display: block
  }
  .panel {
    background: white;
    color: black
  }
  .cards {
    display: none!important
  }
  #stockTable th {
    color: black;
    background: #eee
  }
  #stockTable td {
    font-size: 8px
  }
  body {
    color: black
  }
  main {
    padding: 0
  }
  .table-wrap {
    padding: 0
  }
  .expiry-print {
    display: inline
  }
  .report-title {
    display: block
  }
  dialog {
    display: none!important
  }
}

// Receiving Orders parser; only the twelve allowed columns are read or sent.
function parseReceiving(workbook){const result=[],seen=new Set();let found=false;
const names=['Receiving number','Date','Receiving description','Status','Item Number','Item Description','Store','Store unit','Qty','Submitted qty','Receiving price','Gross value'];
for(const sn of workbook.SheetNames){const sheet=workbook.Sheets[sn],rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:true});let map=null;
for(let i=0;i<rows.length;i++){const row=rows[i],normalized=row.map(v=>String(v).trim().toLowerCase());if(names.every(n=>normalized.includes(n.toLowerCase()))){map=names.map(n=>normalized.indexOf(n.toLowerCase()));found=true;continue}if(!map)continue;
const v=map.map(c=>row[c]??'');if(v[0]===''&&v[4]==='')continue;
const r={};SOURCE.forEach((f,j)=>r[f[0]==='total'?'grossValue':f[0]]=v[j]);
for(const k of ['receivingNumber','code']){const j=k==='receivingNumber'?0:4,c=sheet[XLSX.utils.encode_cell({r:i,c:map[j]})];if(c&&c.t==='n'&&c.w)r[k]=c.w;}
['receivingNumber','code','item','store','unit','receivingDescription','sourceStatus'].forEach(k=>r[k]=String(r[k]??'').trim());
if(typeof r.received==='number'){const d=XLSX.SSF.parse_date_code(r.received,{date1904:!!workbook.Workbook?.WBProps?.date1904});if(d)r.received=`${
    d.y
  }
  -${
    String(d.m).padStart(2, '0')
  }
  -${
    String(d.d).padStart(2, '0')
  }
  `;}
r.received=String(r.received).trim();const date=new Date(r.received+'T00:00:00Z');
const bad=['receivingNumber','code','item','store','unit'].some(k=>!r[k])||!/^\d{4}-\d{2}-\d{2}$/.test(r.received)||!Number.isFinite(date.getTime())||date.toISOString().slice(0,10)!==r.received;
if(bad)throw Error(t('badRow')+' '+(i+1)+' ('+sn+')');
for(const k of ['quantity','submittedQty','price','grossValue']){const v=r[k];r[k]=typeof v==='number'?v:Number(String(v).replace(/,/g,'').trim());if(v===''||!Number.isFinite(r[k])||r[k]<0)throw Error(t('badRow')+' '+(i+1)+' / '+k);}
const key=JSON.stringify([r.receivingNumber,r.code,r.store,r.unit].map(v=>v.trim().toLowerCase()));if(seen.has(key))throw Error(t('duplicate')+': '+r.receivingNumber+' / '+r.code);seen.add(key);result.push(r);
}}
if(!found||!result.length)throw Error(t('noRows'));if(result.length>2000)throw Error('Maximum 2000 rows / الحد الأقصى ٢٠٠٠ صف');return result;}

function xml(v){return String(v??'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function col(n){let s='';for(n++;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s;}
function makeXlsx(rows,meta){
 const defs=[...columns(),['archivedAt',t('archivedAt')]];
 const headings=defs.map(c=>c[1]);
 const lastColumn=col(defs.length-1);
 const totalRow=Array(defs.length).fill('');totalRow[0]=t('total');totalRow[defs.findIndex(c=>c[0]==='total')]=Math.round(rows.reduce((s,r)=>s+r.total,0)*100)/100;
 const matrix=[[t(activeView==='archived'?'archiveReport':'reportTitle')],[meta],headings,...rows.map(r=>defs.map(([k])=>{
 if(k==='days')return r.days===null?'':r.days;
 if(k==='followUp')return followLabel(r.followUp);
 if(k==='archiveState')return t(r.archived?'archived':'active');
 if(k==='expiry')return r.expiry||'';
 return r[k]??'';
 })),totalRow];
 const sheet=matrix.map((row,i)=>`<row r="${i+1}">${
    row.map((v, j)=>typeof v==='number'?`<c r="${col(j)}${i+1}" s="2"><v>${v}</v></c>`: `<c r="${col(j)}${i+1}" t="inlineStr" s="${i===2?1:0}"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')
  }
  </row>`).join('');
 const pre='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 const files={
 '[Content_Types].xml':pre+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
 '_rels/.rels':pre+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
 'xl/workbook.xml':pre+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Expiry Report" sheetId="1" r:id="rId1"/></sheets></workbook>',
 'xl/_rels/workbook.xml.rels':pre+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
 'xl/styles.xml':pre+'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Arial"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Arial"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF132B43"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFill="1" applyFont="1"/><xf numFmtId="4" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
 'xl/worksheets/sheet1.xml':pre+`<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" rightToLeft="${lang==='ar'?1:0}"><pane ySplit="3" topLeftCell="A4" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="18" customWidth="1"/><col min="2" max="2" width="30" customWidth="1"/><col min="3" max="${defs.length}" width="18" customWidth="1"/></cols><sheetData>${sheet}</sheetData><autoFilter ref="A3:${lastColumn}${rows.length+3}"/><mergeCells count="2"><mergeCell ref="A1:${lastColumn}1"/><mergeCell ref="A2:${lastColumn}2"/></mergeCells><pageMargins left="0.3" right="0.3" top="0.5" bottom="0.5" header="0.2" footer="0.2"/><pageSetup paperSize="9" orientation="landscape"/></worksheet>`
 };
 return zip(files);
}
function zip(files){
 const encoder=new TextEncoder(),chunks=[],central=[];let offset=0;
 const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
 const crc=bytes=>{let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0;};
 const head=(size)=>{const b=new Uint8Array(size);return [b,new DataView(b.buffer)];};
 for(const [path,content] of Object.entries(files)){
 const name=encoder.encode(path),bytes=encoder.encode(content),sum=crc(bytes);let [h,v]=head(30);
 v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(12,33,true);v.setUint32(14,sum,true);v.setUint32(18,bytes.length,true);v.setUint32(22,bytes.length,true);v.setUint16(26,name.length,true);chunks.push(h,name,bytes);
 let [c,d]=head(46);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(14,33,true);d.setUint32(16,sum,true);d.setUint32(20,bytes.length,true);d.setUint32(24,bytes.length,true);d.setUint16(28,name.length,true);d.setUint32(42,offset,true);central.push(c,name);offset+=h.length+name.length+bytes.length;
 }
 const size=central.reduce((s,b)=>s+b.length,0),count=Object.keys(files).length;let [end,v]=head(22);v.setUint32(0,0x06054b50,true);v.setUint16(8,count,true);v.setUint16(10,count,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);
 return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
